services:
  - type: web
    name: jeevan-sahay-healthtech
    runtime: node
    plan: 1c-2g
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && exec npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: "off"
    disk:
      name: jeevan-sahay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: DATABASE_URL
        value: file:/var/data/jeevansahay.db
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
